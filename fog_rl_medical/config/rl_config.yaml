training:
  num_episodes: 2000                        # Episodes for training
  high_policy_update_freq: 10               # Update high-level policy every 10 steps
  low_policy_update_freq: 1                 # Update low-level policies every step
  target_update_freq: 100                   # Update target networks
  batch_size: 64                            # Batch size for training
  memory_size: 100000                       # Larger replay buffer for 16 nodes (increased from 50000)
  learning_rate: 0.0005                     # Base learning rate
  gamma: 0.99                               # Discount factor
  epsilon_start: 1.0                        # Initial exploration rate
  epsilon_end: 0.01                         # Final exploration rate
  epsilon_decay: 0.998                      # Epsilon decay rate
  save_frequency: 100                       # Save model every 100 episodes
  eval_frequency: 200                       # Evaluate every 200 episodes
  
# ========================================
# ALGORITHM-SPECIFIC HYPERPARAMETERS
# ========================================

algorithms:
  hdqn:
    name: "Hierarchical DQN (Rainbow Dueling)"
    hidden_dim: 256
    dropout: 0.1
    layer_norm: true
    residual_connections: true
    
  standalone_dqn:
    name: "Standalone DQN"
    hidden_dim: 256
    dropout: 0.05
    
  gnn_rl:
    name: "Graph Neural Network RL"
    hidden_dim: 128
    gcn_layers: 3
    aggregation: "mean"
    
  simple_hierarchical:
    name: "Simple Hierarchical (Heuristic)"
    
  random:
    name: "Random Allocation (Baseline)"
