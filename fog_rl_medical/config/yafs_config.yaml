# YAFS Configuration
# Set use_yafs to true to enable YAFS environment (requires YAFS installation)
# Set to false to use custom fog environment (default)

simulator:
  use_yafs: false  # Set to true to use YAFS simulator
  yafs_enabled: false  # Auto-detected based on installation
  
environment:
  num_fog_nodes: 16                         # Expanded from 5 to 16 nodes
  simulation_time: 1000                     # seconds

network:
  # Realistic Network Bandwidth (Mbps)
  bandwidth_fog_to_fog: 1000                # 1 Gbps inter-node (upgraded from 10)
  bandwidth_fog_to_cloud: 100               # 100 Mbps WAN uplink
  latency_fog_to_fog: 1                     # 1 ms local network (upgraded from 5)
  latency_fog_to_cloud: 20                  # 20 ms to cloud
  latency_sensor_to_fog: 2                  # 2 ms sensor to fog

nodes:
  fog:
    cpu_cores: 12                           # 12 cores per fog node (realistic)
    memory_gb: 32                           # 32 GB per fog node (realistic)
    power_watts: 150                        # Average power consumption
  cloud:
    cpu_cores: 128                          # Powerful cloud instance
    memory_gb: 512                          # Large cloud memory
    power_watts: 2000                       # Enterprise power
